digit-ui:
  namespace: osun
  image:
    repository: egovio/digit-ui
    tag: health-dashboard-digit-ui-8a3b8bbd1b-850
  extraVolumes: |
    - name: js-injection
      configMap:
        name: digit-ui-js-injection

  extraVolumeMounts: |
    - mountPath: /etc/nginx/conf.d/sub_filter.conf
