global:
  hosts:
    - nmep-nigeria-hcm.digit.org
    - taraba-central-hcm.digit.org
    - tarabauat-central-hcm.digit.org

disableAnnotationTimestamp: true

# Common Labels
labels:
  app: "airflow-trigger-api"
  group: "digit-health"

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  rewriteEnable: false
  rewritePath: ""
  context: "airflow-trigger-api"

# Init Containers Configs
initContainers:
  extraInitContainers: |
    - name: run-migration
      image: bhanuprakashmegov/airflow-custom-trigger:trb-aug14-1
      command: [ "python", "migrate.py" ]
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-host
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: password
        - name: DB_SCHEMAS
          value: "public,tarabauat,taraba"

httpPort: 8000

# Container Configs
image:
  repository: "bhanuprakashmegov/airflow-custom-trigger"
  tag: "trb-aug14-1"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"
#appType: "java-spring"
#tracing-enabled: true
#heap: "-Xmx192m -Xms192m"
#java-args: ""
#egov-mdms-service-host-key: "mdms-v2"

# Additional Container Envs
env: |
  - name: AIRFLOW_BASE_URL
    value: "http://airflow-api-server.airflow.svc.cluster.local:8080"
  - name: ALLOWED_ORIGINS
    value: "*"    # lock this down to your React app's URL in prod
  - name: AIRFLOW_USERNAME
    valueFrom:
      secretKeyRef:
        name: airflow-admin-credentials
        key: username
  - name: AIRFLOW_PASSWORD
    valueFrom:
      secretKeyRef:
        name: airflow-admin-credentials
        key: password
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: IS_CENTRAL_INSTANCE_ENABLED
    value: "true"
  - name: EGOV_DASHBOARD_ANALYTICS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: dashboard-analytics
  - name: LOG_LEVEL
    value: "INFO"
  - name: REPORT_ESTIMATE_CHART_KEYS
    value: '{"user_sync_status": "user_sync_status_estimate","spaq_approved_hf": "spaq_approved_hf_estimate","hf_stock_summary": "hf_stock_summary_estimate","smc_referral_report": "smc_referral_report_estimate","beneficiary_visit_list": "beneficiary_visit_list_estimate","daily_hf_summary_report": "daily_hf_summary_report_estimate","cumulative_daily_summary_form": "cumulative_daily_summary_form_estimate","cohort_report": "cohort_report_estimate"}'
  - name: CUSTOM_REPORT_RETRY_COOLDOWN_SECONDS
    value: "3600"
  - name: CUSTOM_REPORT_RETRY_COOLDOWN_OVERRIDES
    value: '{"beneficiary_visit_list": "NEVER","cohort_report": "NEVER"}'
  - name: RETURN_FAILED_REPORTS
    value: "false"

resources: |
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"