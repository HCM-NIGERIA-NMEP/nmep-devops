apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nmep-central-prd-appset-core
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: audit-service
          - name: boundary-service
          - name: egov-accesscontrol
          - name: egov-enc-service
          - name: egov-filestore
          - name: egov-idgen
          - name: egov-indexer
          - name: egov-localization
          - name: egov-notification-mail
          - name: egov-otp
          - name: egov-persister
          - name: egov-url-shortening
          - name: egov-user
          - name: egov-workflow-v2
          - name: error-handler
          - name: gateway
          - name: mdms-v2
          - name: pgr-services
          - name: service-request
          - name: user-otp
          - name: internal-gateway-scg
          - name: egov-malware-detection
          - name: inbox
          - name: pdf-service

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: git@github.com:HCM-NIGERIA-NMEP/nmep-devops.git
        targetRevision: nmep-central-prd
        path: config-as-code/helm/charts/core-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/ng-nmep-central-prd.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: egov

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas