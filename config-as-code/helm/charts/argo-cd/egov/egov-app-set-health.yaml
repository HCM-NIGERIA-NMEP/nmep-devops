apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nmep-central-prd-appset-health
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: health-attendance
          - name: health-expense
          - name: health-muster-roll
          - name: boundary-management
          - name: project
          - name: stock
          - name: referralmanagement
          - name: product
          - name: individual
          - name: household
          - name: facility
          - name: beneficiary-idgen
          - name: health-notification-service
          - name: egov-notification-push
          - name: worker-registry
          - name: project-factory
          - name: excel-ingestion

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: git@github.com:HCM-NIGERIA-NMEP/nmep-devops.git
        targetRevision: nmep-central-prd
        path: config-as-code/helm/charts/health-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/ng-nmep-central-prd.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: egov

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s