apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: central-uat-osun-appset-health
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: transformer

  template:
    metadata:
      name: 'osun-{{name}}'

    spec:
      project: default

      source:
        repoURL: git@github.com:HCM-KEBBI/kebbi-devops.git
        targetRevision: osun-argo-test
        path: config-as-code/helm/charts/health-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../argo-cd/osun/osun-central-uat.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: osun

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 100
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
