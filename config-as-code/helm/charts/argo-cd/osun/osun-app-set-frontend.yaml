apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: osun-nmep-central-prd-appset-frontend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: digit-ui
          - name: workbench-ui
          - name: dashboard-ui
          - name: microplan-ui
          - name: payments-ui

  template:
    metadata:
      name: 'osun-{{name}}'

    spec:
      project: osun-project

      source:
        repoURL: git@github.com:HCM-NIGERIA-NMEP/nmep-devops.git
        targetRevision: nmep-central-prd
        path: config-as-code/helm/charts/frontend/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/osun-nmep-central-prd.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: osun

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s