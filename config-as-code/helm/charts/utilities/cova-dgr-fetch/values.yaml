# Common Labels
labels:
  app: "cova-dgr-fetch"
  group: "case-management"

cron:
  schedule: "*/60 * * * *"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

extraVolumes: |
  - name: tmp
    emptyDir: {}

extraVolumeMounts: |
  - name: tmp
    mountPath: /tmp

# Container Configs
image:
  repository: "byrnedo/alpine-curl"
  tag: "latest"
args: 
- --verbose
- -XPOST
- http://case-management.egov:8080/case-management/cova/v1/_create
- --header
- "Content-Type: application/json"
-  --data
- '{ "RequestInfo": { "apiId": "apiId", "ver": "version", "action": "action", "did": "did", "key": "key", "msgId": "msgId", "requesterId": "requestId", "authToken": "5f4e603a-823c-4ae4-ab79-9a0cf1d6c4b6", "userInfo": { "id": 1, "uuid": "COVA_APP_PULL" } } }'
