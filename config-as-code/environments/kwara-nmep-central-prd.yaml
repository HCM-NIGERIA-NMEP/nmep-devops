  project-factory-host: kwara-project-factory
  excel-ingestion-generation-save-topic: "kwara-save-generated-file"
  excel-ingestion-generation-update-topic: "kwara-update-generated-file"
  excel-ingestion-processing-save-topic: "kwara-save-processing-file"
