project-factory:
  initContainers:
    dbMigration:
      image:
        repository: "project-factory-db"
        tag: nigeria-go-deep-2-0f1e09e
  image:
    repository: egovio/project-factory
    tag: nigeria-go-deep-2-0f1e09e
  central-instance-enabled: false
  central-instance-build: true
  namespace: kwara
  heap: "-Xmx768m -Xms512m"
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  groupId: "kwara-project-factory"
  ingress:
    name: kwara-project-factory
    namespace: egov
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  plan-service: kwara-plan-service
  census-service: kwara-census-service
  excel-ingestion-host: kwara-excel-ingestion
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: kwara
  defaultTenantId: kwara
  saveCampaignDetails: "kwara-save-campaign-details"
  updateCampaignDetails: "kwara-update-campaign-details"
  saveProjectCampaignDetailsTopic: "kwara-save-project-campaign-details"
  updateProjectCampaignDetailsTopic: "kwara-update-project-campaign-details"
  startCampaignMappingTopic: "kwara-start-campaign-mapping"
  createResourceDetailsTopic: "kwara-create-resource-details"
  updateResourceDetailsTopic: "kwara-update-resource-details"
  createResourceActivityTopic: "kwara-create-resource-activity"
  updateGeneratedResourceDetailsTopic: "kwara-update-generated-resource-details"
  createGeneratedResourceDetailsTopic: "kwara-create-generated-resource-details"
  savePlanFacilityTopic: "kwara-project-factory-save-plan-facility"
  saveSheetDataTopic: "kwara-save-sheet-data"
  updateSheetDataTopic: "kwara-update-sheet-data"
  saveMappingDataTopic: "kwara-save-mapping-data"
  updateMappingDataTopic: "kwara-update-mapping-data"
  deleteMappingDataTopic: "kwara-delete-mapping-data"
  saveProcessDataTopic: "kwara-save-process-data"
  updateProcessDataTopic: "kwara-update-process-data"
  startAdminConsoleTaskTopic: "kwara-start-admin-console-task"
  startAdminConsoleMappingTaskTopic: "kwara-start-admin-console-mapping-task"
  notificationEmailTopic: "kwara-egov.core.notification.email"
  testTopic: "kwara-test-topic-project-factory"
  hcmProcessingResultTopic: "kwara-hcm-processing-result"
  facilityCreateBatchTopic: "kwara-hcm-facility-create-batch"
  userCreateBatchTopic: "kwara-hcm-user-create-batch"
  mappingBatchTopic: "kwara-hcm-mapping-batch"
  campaignMarkFailedTopic: "kwara-hcm-campaign-mark-failed"
  userMainBoundary: "MICROPLAN_MO"
  userMainBoundaryType: "COUNTRY"
  maxResourceCreationAttempts: "10"
  waitTimeOfEachAttemptMs: "20000"
  retryTillResourceCreationCompletes: "5"
  command: |
    - sh
    - -c
  args: |
    - |
      sed -i "s/const groupId = 'project-factory'/const groupId = process.env.KAFKAJS_GROUP_ID || 'project-factory'/g" src/server/kafka/Listener.ts
      sed -i 's/--max-old-space-size=3072/--max-old-space-size=1024/g' package.json
      yarn prod
  nodeSelector:
    architecture: amd64
    kubernetes.io/arch: amd64

excel-ingestion:
  initContainers:
    dbMigration:
      image:
        repository: "excel-ingestion-db"
        tag: nnigeria-go-deep-2-ee76944
