project-factory:
  central-instance-enabled: false
  central-instance-build: true
  namespace: kebbi
  heap: "-Xmx512m -Xms256m"
  replicas: 2
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  groupId: "ke-project-factory"
  ingress:
    name: kebbi-project-factory
    namespace: egov
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  plan-service: ke-plan-service
  census-service: ke-census-service
  excel-ingestion-host: ke-excel-ingestion
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: ke
  defaultTenantId: ke
  saveCampaignDetails: "ke-save-campaign-details"
  updateCampaignDetails: "ke-update-campaign-details"
  saveProjectCampaignDetailsTopic: "ke-save-project-campaign-details"
  updateProjectCampaignDetailsTopic: "ke-update-project-campaign-details"
  startCampaignMappingTopic: "ke-start-campaign-mapping"
  createResourceDetailsTopic: "ke-create-resource-details"
  updateResourceDetailsTopic: "ke-update-resource-details"
  createResourceActivityTopic: "ke-create-resource-activity"
  updateGeneratedResourceDetailsTopic: "ke-update-generated-resource-details"
  createGeneratedResourceDetailsTopic: "ke-create-generated-resource-details"
  savePlanFacilityTopic: "ke-project-factory-save-plan-facility"
  saveSheetDataTopic: "ke-save-sheet-data"
  updateSheetDataTopic: "ke-update-sheet-data"
  saveMappingDataTopic: "ke-save-mapping-data"
  updateMappingDataTopic: "ke-update-mapping-data"
  deleteMappingDataTopic: "ke-delete-mapping-data"
  saveProcessDataTopic: "ke-save-process-data"
  updateProcessDataTopic: "ke-update-process-data"
  startAdminConsoleTaskTopic: "ke-start-admin-console-task"
  startAdminConsoleMappingTaskTopic: "ke-start-admin-console-mapping-task"
  notificationEmailTopic: "ke-egov.core.notification.email"
  userMainBoundary: "MICROPLAN_MO"
  userMainBoundaryType: "COUNTRY"
  maxResourceCreationAttempts: "10"
  waitTimeOfEachAttemptMs: "20000"
  retryTillResourceCreationCompletes: "5"
  command: |
    - sh
    - -c
  args: |
    - |
      sed -i "s/const groupId = 'project-factory'/const groupId = process.env.KAFKAJS_GROUP_ID || 'project-factory'/g" src/server/kafka/Listener.ts
      sed -i "s/tenantId: 'mz'/tenantId: request?.body?.RequestInfo?.userInfo?.tenantId || config.app.defaultTenantId/g" src/server/api/campaignApis.ts
      sed -i 's/--max-old-space-size=3072/--max-old-space-size=1024/g' package.json
      yarn prod

