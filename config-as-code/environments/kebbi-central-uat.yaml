    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  initContainers:
    gitSync:
      enabled: true
      repo: "git@github.com:HCM-KEBBI/health-campaign-config"
      branch: "CENTRAL-UAT"
  config-schema-paths: "file:///work-dir/health-campaign-config/egov-dss-dashboards/ke/dashboard-analytics/*.json"

