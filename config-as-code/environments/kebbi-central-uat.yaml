census-service:
  namespace: kebbi
  heap: "-Xmx256m -Xms256m"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 368Mi
  cpu_limits: 300m
  memory_limits: 512Mi
  plan-service-host: ke-plan-service
  resource-census-create-topic: ke-resource-census-create-topic
  update-plan-facility: "ke-update-plan-facility"
  ingress:
    namespace: kebbi

plan-service:
  namespace: kebbi
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  ingress:
    namespace: kebbi
  egov-mdms-service-host-key: 'mdms-v2'
  egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"
  egov-mdms-service-v2-endpoint-key: "/mdms-v2/v2/_search"
  census-service: ke-census-service
  project-factory: ke-project-factory
  resource-microplan-create-topic: ke-resource-microplan-create-topic

resource-generator:
  namespace: kebbi
  heap: "-Xmx256m -Xms256m"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 368Mi
  cpu_limits: 300m
  memory_limits: 512Mi  
  egov-mdms-service-host-key: 'mdms-v2'
  egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"
  egov-mdms-service-v2-endpoint-key: "/mdms-v2/v2/_search"
  plan-service: ke-plan-service
  census-service: ke-census-service
  project-factory: ke-project-factory
  resource-microplan-create-topic: ke-resource-microplan-create-topic

project-factory:
  namespace: kebbi
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  ingress:
    namespace: kebbi
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  save-campaign-details: ke-save-campaign-details
  update-campaign-details: ke-update-campaign-details
  plan-service: ke-plan-service
  census-service: ke-census-service
  db-url: ke-db-url  