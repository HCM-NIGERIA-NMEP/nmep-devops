digit-ui:
  image:
    repository: egovio/digit-ui
    tag: health-dashboard-digit-ui-8a3b8bbd1b-850
  namespace: osun
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://central-instance-uat-assets.s3.af-south-1.amazonaws.com/globalConfig-os.js type=text/javascript></script>
      ';"
  cpu_requests: 200m
  memory_requests: 256Mi
  cpu_limits: 300m
  memory_limits: 512Mi
    
workbench-ui:
  image:
    repository: egovio/workbench-ui
    tag: HDDF-4931-95f2adc
  namespace: osun
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://central-instance-uat-assets.s3.af-south-1.amazonaws.com/globalConfigsWorkbench-os.js type=text/javascript></script>';"
