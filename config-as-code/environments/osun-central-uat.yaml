excel-ingestion:
  image:
    repository: egovio/excel-ingestion
    tag: nigeria-go-deep-2-312dd54
  namespace: osun
  ingress:
    name: osun-excel-ingestion
    namespace: egov
  group-id: "os-excel-ingestion"
  cpu_requests: 200m
  memory_requests: 768Mi
  egov-mdms-service-host-key: 'mdms-v2'
  egov-mdms-service-endpoint-key: "mdms-v2/v2/_search"
  defaultLocale: 'en_NG'
  central-instance-name: egov
  central-instance-build: true
  central-instance-enabled: false
  project-factory-host: os-project-factory
  excel-ingestion-generation-save-topic: "os-save-generated-file"
  excel-ingestion-generation-update-topic: "os-update-generated-file"
  excel-ingestion-processing-save-topic: "os-save-processing-file"
  excel-ingestion-processing-update-topic: "os-update-processing-file"
  excel-ingestion-sheet-data-save-topic: "os-save-sheet-data-temp"
  excel-ingestion-sheet-data-delete-topic: "os-delete-sheet-data-temp"
  excel-ingestion-processing-result-topic: "os-hcm-processing-result"

