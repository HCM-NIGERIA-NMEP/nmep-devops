project-factory:
  initContainers:
    dbMigration:
      image:
        repository: "project-factory-db"
        tag: nigeria-go-deep-2-b897dc0
  image:
    repository: egovio/project-factory
    tag: nigeria-go-deep-2-b897dc0
  central-instance-enabled: false
  central-instance-build: true
  namespace: kwara
  heap: "-Xmx768m -Xms512m"
  replicas: 2
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  groupId: "kw-project-factory"
  ingress:
    name: kwara-project-factory
    namespace: egov
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  plan-service: kw-plan-service
  census-service: kw-census-service
  excel-ingestion-host: kw-excel-ingestion
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: kw
  defaultTenantId: kw
  saveCampaignDetails: "kw-save-campaign-details"
  updateCampaignDetails: "kw-update-campaign-details"
  saveProjectCampaignDetailsTopic: "kw-save-project-campaign-details"
  updateProjectCampaignDetailsTopic: "kw-update-project-campaign-details"
  startCampaignMappingTopic: "kw-start-campaign-mapping"
  createResourceDetailsTopic: "kw-create-resource-details"
  updateResourceDetailsTopic: "kw-update-resource-details"
  createResourceActivityTopic: "kw-create-resource-activity"
  updateGeneratedResourceDetailsTopic: "kw-update-generated-resource-details"
  createGeneratedResourceDetailsTopic: "kw-create-generated-resource-details"
  savePlanFacilityTopic: "kw-project-factory-save-plan-facility"
  saveSheetDataTopic: "kw-save-sheet-data"
  updateSheetDataTopic: "kw-update-sheet-data"
  saveMappingDataTopic: "kw-save-mapping-data"
  updateMappingDataTopic: "kw-update-mapping-data"
  deleteMappingDataTopic: "kw-delete-mapping-data"
  saveProcessDataTopic: "kw-save-process-data"
  updateProcessDataTopic: "kw-update-process-data"
  startAdminConsoleTaskTopic: "kw-start-admin-console-task"
  startAdminConsoleMappingTaskTopic: "kw-start-admin-console-mapping-task"
  notificationEmailTopic: "kw-egov.core.notification.email"
  testTopic: "kw-test-topic-project-factory"
  hcmProcessingResultTopic: "kw-hcm-processing-result"
  facilityCreateBatchTopic: "kw-hcm-facility-create-batch"
  userCreateBatchTopic: "kw-hcm-user-create-batch"
  mappingBatchTopic: "kw-hcm-mapping-batch"
  campaignMarkFailedTopic: "kw-hcm-campaign-mark-failed"
  userMainBoundary: "MICROPLAN_MO"
  userMainBoundaryType: "COUNTRY"
  maxResourceCreationAttempts: "10"
  waitTimeOfEachAttemptMs: "20000"
  retryTillResourceCreationCompletes: "5"
  command: |
    - sh
    - -c
  args: |
    - |
      sed -i "s/const groupId = 'project-factory'/const groupId = process.env.KAFKAJS_GROUP_ID || 'project-factory'/g" src/server/kafka/Listener.ts
      sed -i 's/--max-old-space-size=3072/--max-old-space-size=1024/g' package.json
      yarn prod

