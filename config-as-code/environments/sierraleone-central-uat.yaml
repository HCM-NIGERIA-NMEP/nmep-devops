dashboard-analytics:
  image:
    repository: egovio/dashboard-analytics
    tag: analytics-raw-response-transform-c0bd721231-76
  namespace: sierraleone
  ingress:
    name: sierraleone-dashboard-analytics
    namespace: egov
  healthChecks:
    enabled: true
    livenessProbePath: "/dashboard-analytics/health"
    readinessProbePath: "/dashboard-analytics/health"
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  initContainers:
    gitSync:
      enabled: true
      repo: "git@github.com:HCM-KEBBI/health-campaign-config"
      branch: "sierraleone"
  config-schema-paths: "file:///work-dir/health-campaign-config/egov-dss-dashboards/si/dashboard-analytics/*.json"

