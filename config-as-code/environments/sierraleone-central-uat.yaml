project-factory:
  initContainers:
    dbMigration:
      image:
        repository: "project-factory-db"
        tag: project-factory-changes-sierraleone-82f83ba1fc-590
  image:
    repository: egovio/project-factory
    tag: project-factory-changes-sierraleone-82f83ba1fc-590
  central-instance-enabled: false
  central-instance-build: true
  namespace: sierraleone
  heap: "-Xmx768m -Xms512m"
  replicas: 2
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  groupId: "si-project-factory"
  ingress:
    name: sierraleone-project-factory
    namespace: egov
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  plan-service: si-plan-service
  census-service: si-census-service
  excel-ingestion-host: si-excel-ingestion
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: si
  defaultTenantId: si
  saveCampaignDetails: "si-save-campaign-details"
  updateCampaignDetails: "si-update-campaign-details"
  saveProjectCampaignDetailsTopic: "si-save-project-campaign-details"
  updateProjectCampaignDetailsTopic: "si-update-project-campaign-details"
  startCampaignMappingTopic: "si-start-campaign-mapping"
  createResourceDetailsTopic: "si-create-resource-details"
  updateResourceDetailsTopic: "si-update-resource-details"
  createResourceActivityTopic: "si-create-resource-activity"
  updateGeneratedResourceDetailsTopic: "si-update-generated-resource-details"
  createGeneratedResourceDetailsTopic: "si-create-generated-resource-details"
  savePlanFacilityTopic: "si-project-factory-save-plan-facility"
  saveSheetDataTopic: "si-save-sheet-data"
  updateSheetDataTopic: "si-update-sheet-data"
  saveMappingDataTopic: "si-save-mapping-data"
  updateMappingDataTopic: "si-update-mapping-data"
  deleteMappingDataTopic: "si-delete-mapping-data"
  saveProcessDataTopic: "si-save-process-data"
  updateProcessDataTopic: "si-update-process-data"
  startAdminConsoleTaskTopic: "si-start-admin-console-task"
  startAdminConsoleMappingTaskTopic: "si-start-admin-console-mapping-task"
  notificationEmailTopic: "si-egov.core.notification.email"
  testTopic: "si-test-topic-project-factory"
  hcmProcessingResultTopic: "si-hcm-processing-result"
  facilityCreateBatchTopic: "si-hcm-facility-create-batch"
  userCreateBatchTopic: "si-hcm-user-create-batch"
  mappingBatchTopic: "si-hcm-mapping-batch"
  campaignMarkFailedTopic: "si-hcm-campaign-mark-failed"
  userMainBoundary: "MICROPLAN_MO"
  userMainBoundaryType: "COUNTRY"
  maxResourceCreationAttempts: "10"
  waitTimeOfEachAttemptMs: "20000"
  retryTillResourceCreationCompletes: "5"
  command: |
    - sh
    - -c
  args: |
    - |
      sed -i "s/const groupId = 'project-factory'/const groupId = process.env.KAFKAJS_GROUP_ID || 'project-factory'/g" src/server/kafka/Listener.ts
      sed -i 's/--max-old-space-size=3072/--max-old-space-size=1024/g' package.json
      yarn prod


