project-factory:
  initContainers:
    dbMigration:
      image:
        repository: "project-factory-db"
        tag: nigeria-go-deep-2-0f1e09e
  image:
    repository: egovio/project-factory
    tag: nigeria-go-deep-2-0f1e09e
  central-instance-enabled: false
  central-instance-build: true
  namespace: osun
  heap: "-Xmx768m -Xms512m"
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  groupId: "osun-project-factory"
  ingress:
    name: osun-project-factory
    namespace: egov
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  plan-service: osun-plan-service
  census-service: osun-census-service
  excel-ingestion-host: osun-excel-ingestion
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: osun
  defaultTenantId: osun
  saveCampaignDetails: "osun-save-campaign-details"
  updateCampaignDetails: "osun-update-campaign-details"
  saveProjectCampaignDetailsTopic: "osun-save-project-campaign-details"
  updateProjectCampaignDetailsTopic: "osun-update-project-campaign-details"
  startCampaignMappingTopic: "osun-start-campaign-mapping"
  createResourceDetailsTopic: "osun-create-resource-details"
  updateResourceDetailsTopic: "osun-update-resource-details"
  createResourceActivityTopic: "osun-create-resource-activity"
  updateGeneratedResourceDetailsTopic: "osun-update-generated-resource-details"
  createGeneratedResourceDetailsTopic: "osun-create-generated-resource-details"
  savePlanFacilityTopic: "osun-project-factory-save-plan-facility"
  saveSheetDataTopic: "osun-save-sheet-data"
  updateSheetDataTopic: "osun-update-sheet-data"
  saveMappingDataTopic: "osun-save-mapping-data"
  updateMappingDataTopic: "osun-update-mapping-data"
  deleteMappingDataTopic: "osun-delete-mapping-data"
  saveProcessDataTopic: "osun-save-process-data"
  updateProcessDataTopic: "osun-update-process-data"
  startAdminConsoleTaskTopic: "osun-start-admin-console-task"
  startAdminConsoleMappingTaskTopic: "osun-start-admin-console-mapping-task"
  notificationEmailTopic: "osun-egov.core.notification.email"
  testTopic: "osun-test-topic-project-factory"
  hcmProcessingResultTopic: "osun-hcm-processing-result"
  facilityCreateBatchTopic: "osun-hcm-facility-create-batch"
  userCreateBatchTopic: "osun-hcm-user-create-batch"
  mappingBatchTopic: "osun-hcm-mapping-batch"
  campaignMarkFailedTopic: "osun-hcm-campaign-mark-failed"
  userMainBoundary: "MICROPLAN_MO"
  userMainBoundaryType: "COUNTRY"
  maxResourceCreationAttempts: "10"
  waitTimeOfEachAttemptMs: "20000"
  retryTillResourceCreationCompletes: "5"
  command: |
    - sh
    - -c
  args: |
    - |
      sed -i "s/const groupId = 'project-factory'/const groupId = process.env.KAFKAJS_GROUP_ID || 'project-factory'/g" src/server/kafka/Listener.ts
      sed -i 's/--max-old-space-size=3072/--max-old-space-size=1024/g' package.json
      yarn prod
  nodeSelector:
    architecture: amd64
    kubernetes.io/arch: amd64

excel-ingestion:
  initContainers:
    dbMigration:
      image:
        repository: "excel-ingestion-db"
