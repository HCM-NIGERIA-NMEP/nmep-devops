census-service:
  namespace: bauchi
  heap: "-Xmx256m -Xms256m"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 368Mi
  cpu_limits: 300m
  memory_limits: 512Mi
  plan-service-host: ba-plan-service
  resource-census-create-topic: ba-resource-census-create-topic
  update-plan-facility: "ba-update-plan-facility"
  ingress:
    namespace: bauchi

plan-service:
  namespace: bauchi
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  ingress:
    namespace: bauchi
  egov-mdms-service-host-key: 'mdms-v2'
  egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"
  egov-mdms-service-v2-endpoint-key: "/mdms-v2/v2/_search"
  census-service: ba-census-service
  project-factory: ba-project-factory
  resource-microplan-create-topic: ba-resource-microplan-create-topic

resource-generator:
  namespace: bauchi
  heap: "-Xmx256m -Xms256m"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 368Mi
  cpu_limits: 300m
  memory_limits: 512Mi  
  egov-mdms-service-host-key: 'mdms-v2'
  egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"
  egov-mdms-service-v2-endpoint-key: "/mdms-v2/v2/_search"
  plan-service: ba-plan-service
  census-service: ba-census-service
  project-factory: ba-project-factory
  resource-microplan-create-topic: ba-resource-microplan-create-topic

project-factory:
  namespace: bauchi
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  ingress:
    namespace: bauchi
  logLevel: 'debug'
  maxDebugChar: '2000'
  mdmsV2SearchEndpoint: 'mdms-v2/v2/_search'
  mdmsV1SearchEndpoint: 'mdms-v2/v1/_search'
  save-campaign-details: ba-save-campaign-details
  update-campaign-details: ba-update-campaign-details
  plan-service: ba-plan-service
  census-service: ba-census-service
  IS_ENVIRONMENT_CENTRAL_INSTANCE: false
  DB_SCHEMA: ba      

dashboard-analytics:
  namespace: bauchi
  heap: "-Xmx512m -Xms256m"
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 200m
  memory_requests: 768Mi
  cpu_limits: 300m
  memory_limits: 1Gi
  initContainers:
    gitSync:
      enabled: true
      repo: "git@github.com:HCM-KEBBI/health-campaign-config"
      branch: "CENTRAL-UAT"
  config-schema-paths: "file:///work-dir/health-campaign-config/egov-dss-dashboards/ba/dashboard-analytics/*.json"

