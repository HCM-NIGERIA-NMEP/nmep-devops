health-expense-calculator:
  namespace: bauchi
  heap: "-Xmx256m -Xms256m"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  ingress:
    namespace: bauchi
  cpu_requests: 200m
  memory_requests: 368Mi
  cpu_limits: 300m
  memory_limits: 512Mi 
  report-header-title: "Health Campaign Payment Report"
  is-attendance-approval-required: "true"
  register-batch-size: 15 
  calculate-musterroll-health: ba-calculate-musterroll-health
  calculate-error-health: ba-calculate-error-health
  calculate-billmeta-health: ba-calculate-billmeta-health
  report-error-queue-topic: ba-report-error-queue-topic
  bill-generation-async-topic: ba-bill-generation-async-topic